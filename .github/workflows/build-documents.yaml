name: Build

on:
  push:
    paths:
      - "report/**"
      - ".github/workflows/build-documents.yaml"
    branches:
      - main
  pull_request:
    paths:
      - "report/**"
      - ".github/workflows/build-documents.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: report/check-in-1.pdf
          work_in_root_file_dir: true

      - name: Upload check-in-1
        uses: actions/upload-artifact@v7
        with:
          name: check-in-1-pdf
          path: report/check-in-1.pdf
